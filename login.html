<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.A.I.N.S - 로그인</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#153856 0%,#1F4E79 60%,#2E6DA4 100%);
  display:flex;align-items:center;justify-content:center;
}
.wrap{text-align:center;width:320px;max-width:90vw;padding:20px;}
.title{color:#fff;font-size:1.4rem;font-weight:900;letter-spacing:2px;margin-bottom:6px;}
.sub{color:rgba(255,255,255,.65);font-size:.75rem;margin-bottom:28px;line-height:1.6;}
.card{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  border-radius:16px;padding:28px;
}
.hint{color:rgba(255,255,255,.8);font-size:.82rem;margin-bottom:12px;}
input[type=password]{
  width:100%;padding:12px 14px;
  border:2px solid rgba(255,255,255,.3);border-radius:10px;
  background:rgba(255,255,255,.1);color:#fff;
  font-size:.95rem;outline:none;font-family:inherit;
  transition:border-color .2s;
}
input[type=password]::placeholder{color:rgba(255,255,255,.4);}
input[type=password]:focus{border-color:rgba(255,255,255,.75);}
.error{color:#ffaaaa;font-size:.75rem;margin-top:8px;min-height:18px;}
button{
  width:100%;margin-top:12px;padding:12px;
  background:#fff;color:#1F4E79;
  border:none;border-radius:10px;
  font-size:.9rem;font-weight:700;cursor:pointer;
  font-family:inherit;transition:background .2s;
}
button:hover{background:#e3f0fb;}
button:disabled{background:#ccc;cursor:not-allowed;}
.footer{color:rgba(255,255,255,.3);font-size:.68rem;margin-top:18px;line-height:1.6;}
.lock-info{color:#ffcc66;font-size:.72rem;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">R.A.I.N.S</div>
  <div class="sub">
    Real-time Airfield Intelligent Notification System for Pavement Safety<br>
    활주로 포장온도 AI 안전경보 시스템
  </div>
  <div class="card">
    <div class="hint">🔒 접근 비밀번호를 입력하세요</div>
    <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="off"/>
    <div class="error" id="pwError"></div>
    <div class="lock-info" id="lockInfo"></div>
    <button id="loginBtn" onclick="doLogin()">🔓 확인</button>
  </div>
  <div class="footer">
    울산공항 RKPU · 활주로 포장온도 AI 안전경보 시스템<br>
    관계자 외 접근 금지
  </div>
</div>
<script>
/* ════════════════════════════════════════════════════════════════
   R.A.I.N.S 인증 모듈 v1.1 (Lv.1 보안 패치)
   ─ 변경점 ─
   1) 비밀번호 평문 → SHA-256 해시 비교
   2) 세션 토큰 = 시간기반 무작위값 (단순 비번 저장 X)
   3) 토큰 만료시간 도입 (8시간)
   4) 5회 오입력 시 5분 잠금
   5) sessionStorage 키 통일 (aura_session)
   ════════════════════════════════════════════════════════════════ */

// 비밀번호 'aura6332'의 SHA-256 해시 (사전계산값)
// 원문이 코드에 보이지 않으므로 F12로 즉시 노출되지 않음
var PW_HASH = '6876e409df5838670671db7ca603f378f0470a757a7fd41a8c4870b938142d74';

var SESSION_KEY = 'aura_session';
var LOCK_KEY = 'aura_lock';
var FAIL_KEY = 'aura_fail_count';
var MAX_FAIL = 5;
var LOCK_MS = 5 * 60 * 1000;        // 5분 잠금
var SESSION_MS = 8 * 60 * 60 * 1000; // 8시간 세션 만료

// SHA-256 해시 계산 (Web Crypto API)
async function sha256(str) {
  var buf = new TextEncoder().encode(str);
  var hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash))
    .map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

// 무작위 세션 토큰 생성
function generateToken() {
  var arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

// 잠금 상태 확인
function checkLock() {
  var lockUntil = parseInt(localStorage.getItem(LOCK_KEY) || '0');
  var now = Date.now();
  if (lockUntil > now) {
    var remain = Math.ceil((lockUntil - now) / 1000);
    var min = Math.floor(remain / 60);
    var sec = remain % 60;
    document.getElementById('lockInfo').textContent =
      '⛔ 잠금 중 — ' + min + '분 ' + sec + '초 후 재시도 가능';
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('pwInput').disabled = true;
    setTimeout(checkLock, 1000);
    return true;
  } else if (lockUntil > 0) {
    // 잠금 해제
    localStorage.removeItem(LOCK_KEY);
    localStorage.removeItem(FAIL_KEY);
    document.getElementById('lockInfo').textContent = '';
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('pwInput').disabled = false;
  }
  return false;
}

// 로그인 처리
async function doLogin() {
  if (checkLock()) return;
  var val = document.getElementById('pwInput').value;
  if (!val) {
    document.getElementById('pwError').textContent = '비밀번호를 입력하세요.';
    return;
  }

  var hash = await sha256(val);
  if (hash === PW_HASH) {
    // 인증 성공: 토큰+만료시각 저장
    var session = {
      token: generateToken(),
      expires: Date.now() + SESSION_MS
    };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    localStorage.removeItem(FAIL_KEY);
    window.location.href = 'index.html';
  } else {
    // 인증 실패: 카운트 증가
    var fails = parseInt(localStorage.getItem(FAIL_KEY) || '0') + 1;
    localStorage.setItem(FAIL_KEY, fails);
    if (fails >= MAX_FAIL) {
      localStorage.setItem(LOCK_KEY, Date.now() + LOCK_MS);
      document.getElementById('pwError').textContent =
        '❌ ' + MAX_FAIL + '회 오입력 — 5분간 잠금됩니다.';
      checkLock();
    } else {
      document.getElementById('pwError').textContent =
        '비밀번호 오류 (' + fails + '/' + MAX_FAIL + ')';
    }
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
    setTimeout(function() {
      document.getElementById('pwError').textContent = '';
    }, 2500);
  }
}

// 이미 유효한 세션이면 자동 이동
function checkExistingSession() {
  var raw = sessionStorage.getItem(SESSION_KEY);
  if (!raw) return false;
  try {
    var s = JSON.parse(raw);
    if (s.token && s.expires && Date.now() < s.expires) {
      window.location.href = 'index.html';
      return true;
    }
  } catch(e) {}
  sessionStorage.removeItem(SESSION_KEY);
  return false;
}

// 초기화
document.getElementById('pwInput').focus();
document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
checkLock();
checkExistingSession();
</script>
</body>
</html>
